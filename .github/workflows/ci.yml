name: Say Hello
on:
    push:
        branches:
        - main

jobs:
    run:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v2
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
        - name: Run start.js
          run: node .github/workflows/start.js